name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q clubTivi-country-flags.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source/clubTivi-main
        run: flutter pub get

      - name: Generate code
        working-directory: source/clubTivi-main
        timeout-minutes: 10
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: source/clubTivi-main
        timeout-minutes: 25
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: clubTivi-APK
          path: source/clubTivi-main/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
